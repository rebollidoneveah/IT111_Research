<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinTrack | Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
   <div class="container-fluid">
    <div class="row auth-wrapper">
      <!-- Image side -->
      <div class="col-lg-6 auth-image login d-flex align-items-end p-5">
        <div class="text-white">
          <h2 class="fw-bold">Welcome back!</h2>
          <p class="mb-0">Pick up right where you left off.</p>
        </div>
      </div>

      <!-- Form side -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center py-5">
        <div class="w-100" style="max-width: 400px;">
          <a href="../index.html" class="navbar-brand fw-bold fs-4 text-decoration-none text-dark d-block mb-4"><i class="bi bi-wallet2 text-brand"></i> FinTrack</a>
          <h3 class="fw-bold">Login</h3>
          <p class="text-muted">Enter your account details below.</p>

          <form>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Password">
              </div>
            </div>
            <div class="d-flex justify-content-between mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <a href="#" class="small">Forgot password?</a>
            </div>
            <a href="dashboard.html" class="btn btn-brand w-100 py-2">Login</a>
          </form>

          <p class="text-center mt-4 mb-0">No account yet? <a href="signup.html">Sign up</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
