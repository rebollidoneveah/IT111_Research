<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinTrack | Sign Up</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <div class="row auth-wrapper">
      <!-- Form side -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center py-5 order-2 order-lg-1">
        <div class="w-100" style="max-width: 440px;">
          <a href="../index.html" class="navbar-brand fw-bold fs-4 text-decoration-none text-dark d-block mb-4"><i class="bi bi-wallet2 text-brand"></i> FinTrack</a>
          <h3 class="fw-bold">Create your account</h3>
          <p class="text-muted">It only takes a minute.</p>

          <form>
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="first" class="form-label">First name</label>
                <input type="text" class="form-control" id="first">
              </div>
              <div class="col-sm-6">
                <label for="last" class="form-label">Last name</label>
                <input type="text" class="form-control" id="last">
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com">
            </div>
            <div class="mb-3">
              <label for="role" class="form-label">I am a</label>
              <select class="form-select" id="role">
                <option selected>Choose...</option>
                <option>Student</option>
                <option>Employee</option>
                <option>Other</option>
              </select>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password">
              </div>
              <div class="col-sm-6">
                <label for="confirm" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirm">
              </div>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="terms">
              <label class="form-check-label" for="terms">I agree to the <a href="#">Terms &amp; Conditions</a></label>
            </div>
            <a href="login.html" class="btn btn-brand w-100 py-2">Sign Up</a>
          </form>

           <p class="text-center mt-4 mb-0">Already have an account? <a href="login.html">Login</a></p>
        </div>
      </div>

      <!-- Image side -->
      <div class="col-lg-6 auth-image signup d-flex align-items-end p-5 order-1 order-lg-2">
        <div class="text-white">
          <h2 class="fw-bold">Take control of your money</h2>
          <p class="mb-0">Track every peso, one transaction at a time.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
